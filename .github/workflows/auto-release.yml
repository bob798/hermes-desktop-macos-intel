name: Auto-release on upstream stable release

# Every 6 hours: check NousResearch/hermes-agent's latest stable release.
# If we haven't rebuilt it yet, build the Intel (x86_64) desktop app from
# the exact upstream release tag and publish DMG + ZIP + checksums.
#
# Discovery runs on cheap ubuntu-latest; the macOS Intel runner
# (macos-15-intel, GitHub's only remaining x86_64 macOS image) only spins
# up when there is something to build.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: intel-auto-release
  cancel-in-progress: false

jobs:
  discover:
    name: Check latest upstream stable release
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      upstream_tag: ${{ steps.check.outputs.upstream_tag }}
      upstream_url: ${{ steps.check.outputs.upstream_url }}
    steps:
      - name: Compare upstream release with ours
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          upstream_json="$(gh api repos/NousResearch/hermes-agent/releases/latest)"
          upstream_tag="$(jq -r '.tag_name' <<<"$upstream_json")"
          upstream_url="$(jq -r '.html_url' <<<"$upstream_json")"
          [ -n "$upstream_tag" ] && [ "$upstream_tag" != "null" ] || { echo "no upstream tag" >&2; exit 1; }
          {
            echo "upstream_tag=$upstream_tag"
            echo "upstream_url=$upstream_url"
          } >> "$GITHUB_OUTPUT"
          if gh release view "$upstream_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Release $upstream_tag already rebuilt; nothing to do."
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "New upstream stable release: $upstream_tag"
          fi

  build-and-publish:
    name: Build and publish Intel macOS build
    needs: discover
    if: needs.discover.outputs.should_build == 'true'
    runs-on: macos-15-intel   # GitHub's last x86_64 macOS runner
    timeout-minutes: 60
    env:
      UPSTREAM_TAG: ${{ needs.discover.outputs.upstream_tag }}
      UPSTREAM_URL: ${{ needs.discover.outputs.upstream_url }}
    steps:
      - name: Check out exact upstream release tag
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ needs.discover.outputs.upstream_tag }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Node 24 ships npm 11.16.0, which upstream's engines field excludes
      # (engines.npm is "<11.10.0 || >=11.17.0"). Pin the newest 11.x instead
      # of npm@latest to stay on the same major the lockfile was written for.
      - name: Use an npm version upstream accepts
        run: npm install -g npm@11.19.0

      - name: Install locked dependencies
        run: npm ci

      # The build below deliberately passes no --publish flag; this guard
      # fails fast (and explains why) if upstream ever stops supplying it.
      - name: Check upstream still pins electron-builder to --publish never
        working-directory: apps/desktop
        run: |
          node -e '
            const fs = require("node:fs")
            const src = fs.readFileSync("scripts/run-electron-builder.mjs", "utf8")
            if (!/--publish[^\n]*never|never[^\n]*--publish/.test(src)) {
              console.error(
                "upstream no longer pins --publish never in " +
                "apps/desktop/scripts/run-electron-builder.mjs.\n" +
                "Add the flag back to the build step below - but exactly once, " +
                "or electron-builder treats the duplicated flag as an array and " +
                "tries to publish to GitHub."
              )
              process.exit(1)
            }
          '

      # Arch only - do NOT add `--publish never` here. Upstream's
      # scripts/run-electron-builder.mjs already prepends it, and a second
      # copy makes yargs collapse the repeats into an array
      # (["never", "never"]). electron-builder compares publish against the
      # *string* "never", so an array reads as "this is a publishing build".
      # Packaging still succeeds, but the final step that writes
      # latest-mac.yml re-emits it as an artifact carrying the GitHub publish
      # config auto-detected from upstream's .git/config; that constructs a
      # GitHub publisher and dies with "GitHub Personal Access Token is not
      # set" long after the DMG and ZIP were built.
      - name: Build unsigned Intel macOS packages
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac -- --x64

      - name: Validate architecture and package integrity
        id: validate
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Main executable must be x86_64 and must not contain arm64
          app_binary="$(find release -path '*/Hermes.app/Contents/MacOS/Hermes' -type f -print -quit)"
          [ -n "$app_binary" ] || { echo "Hermes executable not found" >&2; exit 1; }
          file "$app_binary" | tee /dev/stderr | grep -q 'x86_64'
          if file "$app_binary" | grep -q 'arm64'; then
            echo "main binary contains arm64" >&2; exit 1
          fi

          # Every native module (node-pty etc.) must also be x86_64
          native_count=0
          while IFS= read -r -d '' f; do
            desc="$(file "$f")"; echo "$desc"
            grep -q 'x86_64' <<<"$desc" || { echo "$f is not x86_64" >&2; exit 1; }
            grep -q 'arm64' <<<"$desc" && { echo "$f contains arm64" >&2; exit 1; }
            native_count=$((native_count + 1))
          done < <(find release -type f \( -name '*.node' -o -name 'spawn-helper' \) -print0)
          (( native_count > 0 )) || { echo "no native modules found to verify" >&2; exit 1; }

          dmgs=(release/*-mac-x64.dmg); zips=(release/*-mac-x64.zip)
          (( ${#dmgs[@]} == 1 && ${#zips[@]} == 1 )) || { echo "expected exactly one x64 DMG and ZIP" >&2; exit 1; }
          hdiutil verify "${dmgs[0]}"

          base="Hermes-${UPSTREAM_TAG#v}-mac-x64"
          mv "${dmgs[0]}" "release/$base.dmg"
          mv "${zips[0]}" "release/$base.zip"
          (cd release && shasum -a 256 "$base.dmg" "$base.zip" > SHA256SUMS.txt)

          {
            echo "dmg=release/$base.dmg"
            echo "zip=release/$base.zip"
            echo "checksums=release/SHA256SUMS.txt"
            echo "upstream_sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ steps.validate.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          cat > "$notes" <<EOF
          Unofficial Intel (x86_64) macOS build, published automatically when upstream ships a stable release.

          - **Upstream**: [$UPSTREAM_TAG]($UPSTREAM_URL), commit \`$UPSTREAM_SHA\`, unmodified
          - **Built by**: [GitHub Actions](../../actions/workflows/auto-release.yml) on macos-15-intel; main binary and all native modules verified x86_64; DMG passed \`hdiutil verify\`
          - **Signing**: ad-hoc (not notarized) — on first launch, right-click → Open, or \`xattr -cr /Applications/Hermes.app\`. Verify against \`SHA256SUMS.txt\` first.

          On first run the app installs the Hermes backend automatically and opens the setup wizard.

          ---

          这是上游稳定版 $UPSTREAM_TAG 的非官方 Intel (x86_64) macOS 构建，由 GitHub Actions 自动完成。未经 Apple 签名/公证，首次打开请右键 → 打开；建议先用 \`SHA256SUMS.txt\` 校验下载文件。
          EOF
          gh release create "$UPSTREAM_TAG" \
            "${{ steps.validate.outputs.dmg }}" \
            "${{ steps.validate.outputs.zip }}" \
            "${{ steps.validate.outputs.checksums }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Hermes Desktop $UPSTREAM_TAG — Intel macOS (x86_64)" \
            --notes-file "$notes" \
            --latest
